services:

  espocrm-db:
    image: mariadb:latest
    container_name: espocrm-db

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

    volumes:
      - espocrm-db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3

    restart: unless-stopped


  espocrm:
    image: espocrm/espocrm:10.0.9
    container_name: espocrm

    environment:
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_USER: ${MARIADB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${MARIADB_PASSWORD}

      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}

      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL}

    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-custom-client:/var/www/html/client/custom

    depends_on:
      espocrm-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 60s
      timeout: 20s
      retries: 3

    ports:
      - "8080:80"

    restart: unless-stopped


  espocrm-daemon:
    image: espocrm/espocrm:10.0.9
    container_name: espocrm-daemon

    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-custom-client:/var/www/html/client/custom

    depends_on:
      espocrm:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 180s
      timeout: 20s
      retries: 3

    entrypoint: docker-daemon.sh

    restart: unless-stopped


volumes:
  espocrm-db:
  espocrm-data:
  espocrm-custom:
  espocrm-custom-client: